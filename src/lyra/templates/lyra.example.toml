# Lyra 配置模板
# ---------------------------------------------------------------------------
# 用法：
#   1. 复制为 lyra.toml（该文件已被 .gitignore 排除，不会入库）
#      cp lyra.example.toml lyra.toml
#   2. 或用 `lyra config init` 自动生成
#   3. `lyra config check` 校验并打印生效配置
#
# 取值优先级：环境变量 LYRA_* > 本文件 > 内置默认值
# 所有路径都可以改；源码内不含任何绝对路径，换机器只改本文件即可。
# ---------------------------------------------------------------------------

config_version = 1

# ===========================================================================
# 受管根：列表结构，阶段一只启用一个；未来加库不改架构
# ===========================================================================
[[roots]]
name = "main"
# library = 就地管理（补歌词、补标签）
# inbox   = 新增文件源，将来自动刮削后整理进 library（阶段三）
role = "library"
# path 是「服务视角」的路径：裸机部署就是真实路径；容器部署是容器内路径
path = "~/Music"
# host_path 仅供 CLI/文档提示，不参与任何逻辑；容器部署可留空
host_path = ""
# 是否按只读方式处理该根（审计模式）。写入需要 false
read_only = false
enabled = true

# ===========================================================================
# 存储：必须在受管根之外
# ===========================================================================
[storage]
data_dir = "./data"

# ===========================================================================
# 网络代理（可选）
# ===========================================================================
[network]
# 代理地址。用于访问境外服务（LRCLIB、MusicBrainz、AcoustID、大模型）。
# 支持 http://、https://、socks5://、socks5h://；留空表示不在配置里指定。
# 设置页保存的值优先于这里；两者都没有时才沿用系统环境变量
# HTTP_PROXY / HTTPS_PROXY / ALL_PROXY。
# 例：proxy = "socks5://10.0.1.8:7890"
proxy = ""

# 即使开了代理也直连的主机。自建的网易云 API、自建的 MusicBrainz 镜像
# 都在内网，送到代理端再绕回来只会失败。
direct_hosts = ["qq.com", "163.com", "126.net", "gtimg.cn"]

# 哪些功能经代理访问。代理多半跑在另一台机器上，它一停，走代理的功能
# 会一起失败——所以逐个功能单独开关。国内来源（QQ、网易云）始终直连。
[network.use_proxy]
lrclib = true
musicbrainz = true
acoustid = true
cover = false

# ===========================================================================
# 监听与发现
# ===========================================================================
[watch]
# auto | inotify | fsevents | poll
backend = "auto"
# 文件稳定判定：连续 stable_seconds 秒无变化，且至少采样 stable_samples 次
stable_seconds = 60
stable_samples = 3
# 轻量清单核对间隔
reconcile_interval_seconds = 900
# 每日完整核对时刻（本地时区）
full_scan_local_time = "03:30"
timezone = "Asia/Shanghai"

# ===========================================================================
# 歌词来源
#   qq     = 主源（华语覆盖较好；部分地区或网络可能不可用）
#   lrclib = 辅源（官方授权；服务端可能 503，必须可降级）
# 未在 enabled 中列出的来源绝不会被使用。
# ===========================================================================
[providers]
enabled = ["qq", "netease", "lrclib"]
# 直连上游的 User-Agent；留空用内置默认
user_agent = ""

[providers.qq]
# 透明反代网关根（替换 https://c.y.qq.com，路径与响应完全一致）。
# 直连被风控时可指向自建反代；留空 = 直连
base_url = ""
minimum_request_interval_seconds = 2
# 每轮最多几个有意义的查询
query_limit_per_round = 3
candidates_per_query = 20
# 每轮详情+歌词请求总预算
detail_and_lyric_limit_per_round = 6
# 上游给出 Retry-After 且等待很短时的有界内联重试（0 = 不重试）
max_inline_retries = 2
max_inline_retry_wait_seconds = 5

[providers.netease]
# 网易云音乐。歌词为毫秒精度 [00:00.000]。
# 与 QQ 的曲库覆盖并不重合，多一个来源多一次命中机会。
minimum_request_interval_seconds = 3.0
query_limit_per_round = 3
candidates_per_query = 20
detail_and_lyric_limit_per_round = 6
request_timeout_seconds = 20
max_inline_retries = 2
max_inline_retry_wait_seconds = 5

[providers.lrclib]
# LRCLIB 无 API key 机制，只要求这两个客户端标识头：
#   X-User-Agent: <name>/<version> (<url>)
#   Lrclib-Client: <name>/<version> (<url>)
# 注意：LRCLIB 会过滤某些默认客户端标识（例如 Jellyfin-Server）。
# 若收到 403，那不是「请求太频繁」（过频是 429），而是标识被拦。
client_name = "Lyra"
client_version = "1.0.0"
client_url = "https://github.com/astralwaveorg/lyra"
# 授权 reference（注册合规用，公开可验证；填你自己的，勿提交到公开仓库）
authorization_ref = ""
# 官方文档口径（https://lrclib.net/docs）：
#   - 公共 API 限额约 20 次/秒；官方建议请求间延迟 200~500ms
#   - 过频返回 429 + Retry-After
#   - 服务端过载返回 503 ServerOverloaded + Retry-After（与 429 区别对待，但同属可自愈）
# 取 0.5s（=2 次/秒），落在建议区间的保守端，比官方上限低一个数量级。
minimum_request_interval_seconds = 0.5
max_backoff_seconds = 3600
# 连续失败多少次触发熔断
circuit_breaker_threshold = 5
circuit_breaker_initial_seconds = 1800
# 过载时的有界内联重试：LRCLIB 会说「Retry-After: 1」，
# 等它说的秒数再试，比直接退避 60 秒有效得多。上限防止锤击。
max_inline_retries = 2
max_inline_retry_wait_seconds = 5

# MusicBrainz 标签来源。默认使用公共 API（每秒最多 1 次请求）。
# 大规模扫描建议自建镜像，把 base_url 指向镜像并把间隔调到 0.2 左右。
[providers.musicbrainz]
enabled = true
base_url = "https://musicbrainz.org"
minimum_request_interval_seconds = 1.1
request_timeout_seconds = 20
search_limit = 8
detail_limit = 3

# 阶段二：指纹兜底（AcoustID）
[providers.acoustid]
# 声学指纹。缺 MBID 或替换候选有歧义时，用音频本身确认录音。
enabled = false
api_key = ""
# 公网服务；自建/代理时改这里
base_url = "https://api.acoustid.org"

# ===========================================================================
# 处理策略
# ===========================================================================
[policy]
# 总开关。false 时全库只读，任何入口都不会写音乐
write_enabled = true
# auto = 不设人工批准队列（用户已授权自动写入）
write_mode = "auto"

# 歌词输出：用户确认「内嵌与 sidecar 两者都要」
write_sidecar_lrc = true
embed_lyrics = true

# 0 字节 / 纯空白 .lrc 视为不存在，可安全填充
fill_empty_lrc = true

# 已有「有效同步歌词」时跳过（无收益、只有风险）。
# 想强制全量重写就改成 false。
skip_if_valid_synced = true

# 清理无时间轴的内嵌歌词（精确字段白名单，绝不碰 LYRICIST / TEXT）
clear_plain_embedded = true

# 纯音乐自动落定：标题含伴奏/纯音乐标记、来源也标记为纯音乐且查不到
# 同步歌词时，自动写入「纯音乐，请欣赏」占位。占位不是猜测的歌词，
# 是把「这首歌没有词」这个结论落盘；写入后状态显示为「纯音乐」，
# 不再进待办，也不再耗来源配额重查
instrumental_placeholder = true

# 未显式启用的来源绝不使用
allow_other_providers = false

[policy.matching]
# 时长闸门：源候选时长与本地音频时长之差上限（秒）
max_duration_delta_seconds = 2
# 最优候选与次优的最小分差，低于此值视为歧义
min_score_margin = 0.15
# 最低总分（0~1）
min_confidence = 0.75
# 时长差 ≤ 此值时，即使「最优与次优接近」也直接接受，不送复核。
# 用途：LRCLIB 上同一首歌常有多条元数据完全相同的记录，判为歧义纯属浪费人工。
# 注意：它**不绕过**版本校验与置信度下限——时长相同并不区分版本
# （例如现场版与录音室版可能时长完全相同；
#   A.I.N.Y. 的重生版差 0.20s，而正确的原版差 0.80s）。
# 设为 0 即关闭这条规则，恢复「同分即复核」。
auto_accept_within_seconds = 1.0
# 兜底自动采用的标题相似度下限：挡住「突然之间 / 刹那之间」这类
# 完全不同的词被时长凑巧骗过（异体字如 漂向北方/飘向北方 有 0.75，不受此限）
auto_accept_loose_title_score = 0.65
# 近似匹配（现场版拿到录音室词）自动采用的标题核心下限
approximate_auto_min_title = 0.95
# 近似匹配：现场版可拿录音室词（AI 高置信判定同曲异版时自动采用）
allow_approximate = true

[policy.tags]
# 标签刮削：监控进程按间隔自动扫描全库。
auto_scan = true
scan_interval_hours = 24
# 自动写入「本地为空、来源有值」的字段；冲突永不自动覆盖。
auto_write = true
# 缺 MBID 或有歧义时用 AcoustID 指纹确认（需 fpcalc 与 api_key）。
fingerprint = true
# 单轮最多自动写入多少首，避免一次改动过大。
max_auto_write_per_run = 300
# 时长差超过此值不自动写入，交人工看一眼。
max_duration_delta_seconds = 5.0
# 低风险纠正自动写：强证据来源把英文标题纠正为中文（文字体系切换）
low_risk_auto_correct = true

[policy.cover]
# 封面自动化。同目录规范命名图片（cover.jpg 等）零网络成本、风险最低，默认自动嵌入
auto_embed_sibling = true
# 网络封面来源链（按序降级）：caa = Cover Art Archive（需标签里有 MusicBrainz 发行 ID）
fetch_sources = ["caa"]
# 自动链的质量门：宽×高不小于此值才采用，不足则换下一来源
min_min_pixels = 90000
# 网络抓取的封面是否自动嵌入；false 时只暂存进待办确认
auto_write = false

[policy.organize]
# 目录归置。红线：默认不动任何文件；存量曲库永远走整理页的人工预览+执行。
#   off       = 只生成归置建议（源路径 → 建议路径），出现在待办里
#   new_files = 对本进程观察到的新入库文件自动归位（可撤销，冲突转待办）
#   full      = 定期把全库文件归位到标准结构（含存量；可撤销，冲突转待办）。
#               监控进程每 6 小时跑一轮，全部移动都有预览记录
#   inbox     = 额外允许 INBOX 根把处理完的文件流转进 library 根（需配 root.target_root）
mode = "off"
# 目标路径模板；字段白名单：artist albumartist album title track_no disc_no year ext
template = "{artist}/{album}/{track_no} - {title}"

# ===========================================================================
# 缓存与重试
# ===========================================================================
[retry]
# 正常完成搜索但无合格候选：初次后 7 天、再 30 天、再 90 天，之后暂停
not_found_intervals_days = [1, 3, 7, 14, 30]
# 有候选但无同步歌词
no_synced_intervals_days = [3, 7, 14, 30, 60]
# 临时网络错误的退避（秒）
transient_backoff_seconds = [60, 300, 1800, 7200, 21600]

# ===========================================================================
# 歌词输出格式
# ===========================================================================
[lyrics]
encoding = "utf-8"
bom = false
line_ending = "lf"
# line_lrc = 逐行 LRC（逐字源降级为行级）
format = "line_lrc"
# 翻译歌词的落盘形态（罗马音独立开关，不能用翻译替代原文）：
#   off        = 丢弃翻译（旧行为）
#   bilingual  = 双语文体：翻译行紧跟原文行写入 .lrc 与内嵌
#   field      = 仅 FLAC 存独立字段
# 兼容旧写法：true 等价 bilingual，false 等价 off
translation = "bilingual"
romanization = false
# 保留逐字歌词原文（QQ QRC）为同名 .qrc 文件；播放器支持少，默认关
keep_word_level = false

# ===========================================================================
# Web 界面
# ===========================================================================
[web]
bind = "127.0.0.1"
port = 8080
auth_required = true
# 首次启动时若未设置密码，会生成随机密码并写入数据目录
# initial-password.txt。生产环境建议用环境变量 LYRA_ADMIN_PASSWORD 注入。
admin_username = "admin"
admin_password = ""

# ===========================================================================
# 大模型（可选）
# ===========================================================================
[ai]
# openai_chat | openai_responses | anthropic
protocol = "openai_chat"
enabled = false
# 可填 base URL（含 /v1）或完整 endpoint
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# 建议用环境变量 LYRA_AI_API_KEY；设置页保存的 token 在 data/ai-token（0600）
api_key = ""
timeout_seconds = 30
max_requests_per_run = 12
auto_clean_duplicates = false
# 智能预审：对落入「待审查」的候选调用模型判定，减少逐首人工确认。
# 判定结论会显示在待办里；enabled=false 时本节其余开关无效
pre_review = false
# 模型判定的采纳阈值（0.5~1.0）：达到且程序闸门（时长/版本）也通过时才自动采纳
pre_review_confidence = 0.85
# 高置信判定是否直接自动采纳（写入留痕、可撤销）；false 时只展示建议
auto_accept = true
# 标签搜索候选的模型核验：通过后按「已核验」处理
verify_tags = false

# ===========================================================================
# 写入事务
# ===========================================================================
[write]
# 只给「人工确认过」的写入做整份备份。
# 自动接受（时长吻合+分数达标+标题艺人达标）的一类不做备份：写错概率低，
# 而每个文件整份复制代价极高（单个文件 24~142MB，全库可能十几 GB）。
# 置 false 即「凡是写入都备份」。
backup_review_only = true
# 写入前完整备份原文件（含内嵌写入时）
backup_before_write = true
# 备份是否自动淘汰（false = 永不自动删，达到水位即停止新增写入）
backup_auto_prune = false
# 备份目录容量水位（字节）；超过则停止新增写入并告警。0 = 不限制
backup_max_bytes = 0
