name: 功能建议
description: 新功能、改进或使用场景
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不只是功能名称
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 界面、配置或 API 可以怎么设计
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue
          required: true
        - label: 这个功能不需要上传曲库或歌词到第三方
          required: true
