name: Bug 报告
description: 功能异常、报错或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 Issue，并确认不是配置或部署问题。
        安全漏洞请不要公开提交，使用 Security Advisories。
  - type: input
    id: version
    attributes:
      label: Lyra 版本
      description: 设置页的版本，或镜像 tag
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - systemd
        - 源码运行
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么，预期是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请删除凭据、密码、Token 和私人路径
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue
          required: true
        - label: 已删除日志中的凭据和私人信息
          required: true
